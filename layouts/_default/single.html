{{ define "main" }}
<article>
  <h1 class="page-title">{{ .Title }}</h1>
  <div class="meta">
    <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02" }}</time>
    {{ with .Params.author }}<span class="author">{{ . }}</span>{{ end }}
    {{ with .Params.tags }}<span class="tags">{{ range . }}<a href="{{ "tags/" | relURL }}{{ . | urlize }}/">{{ . }}</a>{{ end }}</span>{{ end }}
  </div>
  <div class="content">
    {{ .Content }}
  </div>
</article>
{{ end }}
