<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  {{ with .Description }}<meta name="description" content="{{ . }}">{{ else }}{{ with site.Params.description }}<meta name="description" content="{{ . }}">{{ end }}{{ end }}
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  {{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ site.Title }}">{{ end }}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <nav>
      <a href="{{ "posts/" | relURL }}">文章</a>
      <a href="{{ "tags/" | relURL }}">标签</a>
      <a href="{{ "index.xml" | relURL }}">RSS</a>
    </nav>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <span>© {{ now.Year }} {{ site.Params.author | default site.Title }}</span>
    <span>Powered by Hugo · GitHub Pages</span>
  </footer>
</body>
</html>
